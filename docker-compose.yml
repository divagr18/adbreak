name: adbreak

x-node-service: &node-service
  build:
    context: .
    dockerfile: Dockerfile.node
  volumes:
    - ./packages:/app/packages
  environment: &node-env
    REDIS_URL: redis://redis:6379
    PLAYOUT_URL: http://playout:3000
    ORIGIN_URL: http://origin
    PUBLIC_ORIGIN_URL: http://localhost:8080
    PACKAGER_URL: http://packager:3000
    ADS_URL: http://ads:3000
    SSAI_URL: http://ssai:3000
    EDGE_URL: http://edge:3000
    COLLECTOR_URL: http://beacon-collector:3000
    # Beacons are fired by the fleet from inside the network, so these must be
    # container-resolvable. Manifest/segment URLs are path-absolute instead, so
    # the same personalized manifest plays for the fleet and for VLC on the host.
    BEACON_BASE: http://edge:3000
    PUBLIC_MEDIA_BASE: ""
    PORT: "3000"
    # Tracing is additive: absent these, services run exactly as before.
    GC_OTLP_URL: ${GC_OTLP_URL:-}
    GC_OTLP_USER: ${GC_OTLP_USER:-}
    GC_TOKEN: ${GC_TOKEN:-}
    TRACE_SAMPLE_RATIO: ${TRACE_SAMPLE_RATIO:-1}
    # Share of sessions whose per-session work is traced. Every span of a break
    # shares that break's trace, so this is what keeps a trace readable.
    SPAN_SAMPLE: ${SPAN_SAMPLE:-0.05}
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  encoder:
    build: plant/encoder
    volumes:
      - hls:/hls
      - encoder-source:/source
    restart: unless-stopped

  origin:
    image: nginx:1.27-alpine
    volumes:
      - hls:/hls:ro
      - ./creatives:/creatives:ro
      - ./plant/origin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on: [encoder]

  playout:
    <<: *node-service
    command: ["npx", "tsx", "watch", "packages/playout/src/index.ts"]
    volumes:
      - ./packages:/app/packages
      - ./schedules:/app/schedules:ro
    ports: ["8087:3000"]
    depends_on: [redis]

  packager:
    <<: *node-service
    command: ["npx", "tsx", "watch", "packages/packager/src/index.ts"]
    ports: ["8081:3000"]
    depends_on: [redis, origin]

  ads:
    <<: *node-service
    command: ["npx", "tsx", "watch", "packages/ads/src/index.ts"]
    volumes:
      - ./packages:/app/packages
      - ./creatives:/app/creatives:ro
    ports: ["8082:3000"]

  ssai:
    <<: *node-service
    command: ["npx", "tsx", "watch", "packages/ssai/src/index.ts"]
    ports: ["8083:3000"]
    depends_on: [packager, ads]

  edge:
    <<: *node-service
    command: ["npx", "tsx", "watch", "packages/edge/src/index.ts"]
    ports: ["8084:3000"]
    depends_on: [ssai, origin, beacon-collector]

  player-fleet:
    <<: *node-service
    command: ["npx", "tsx", "watch", "packages/player-fleet/src/index.ts"]
    environment:
      <<: *node-env
      SESSIONS: "200"
    ports: ["8088:3000"]
    depends_on: [edge]

  beacon-collector:
    <<: *node-service
    command: ["npx", "tsx", "watch", "packages/beacon-collector/src/index.ts"]
    volumes:
      - ./packages:/app/packages
      - ./creatives:/app/creatives:ro
      - ./data:/data
    ports: ["8085:3000"]

  chaos-injector:
    <<: *node-service
    command: ["npx", "tsx", "watch", "packages/chaos-injector/src/index.ts"]
    volumes:
      - ./packages:/app/packages
      - ./data:/data
    ports: ["8086:3000"]

  # The agent. Deliberately does NOT mount ./data: that directory holds
  # ground-truth.jsonl, the record of what chaos actually injected. It is the
  # answer key, and an agent that can read it is not diagnosing anything.
  agent:
    <<: *node-service
    command: ["npx", "tsx", "watch", "packages/agent/src/index.ts"]
    volumes:
      - ./packages:/app/packages
      - ./runbooks:/app/runbooks:ro
      - ./agent-data:/agent-data
      - ${APPDATA}/gcloud/application_default_credentials.json:/gcloud/adc.json:ro
    environment:
      <<: *node-env
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/adc.json
      GOOGLE_GENAI_USE_ENTERPRISE: "true"
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-adbreak-hack-2026}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GRAFANA_URL: ${GRAFANA_URL:-}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}
      MCP_GRAFANA_URL: http://mcp-grafana:8000/sse
      RUNBOOK_DIR: /app/runbooks
      RUN_DIR: /agent-data/agent-runs
    ports: ["8090:3000"]
    depends_on: [mcp-grafana]

  # The Grafana MCP server as a first-class service. The agent reaches Grafana
  # only through this - it is the judged integration - and running it over SSE
  # rather than spawning `docker run` per query keeps the agent out of
  # docker-in-docker. -allowed-hosts is required because the SSE transport
  # rejects non-loopback Host headers by default (DNS-rebinding protection).
  mcp-grafana:
    image: mcp/grafana:latest
    command: ["-address", "0.0.0.0:8000", "-allowed-hosts", "*"]
    environment:
      GRAFANA_URL: ${GRAFANA_URL:-}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}
    ports: ["8000:8000"]
    restart: unless-stopped

  # Ships plant metrics and logs to Grafana Cloud. Runs only when the GC_*
  # ingest credentials are present; the plant is fully functional without it.
  alloy:
    image: grafana/alloy:latest
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./plant/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    environment:
      GC_PROM_URL: ${GC_PROM_URL:-}
      GC_PROM_USER: ${GC_PROM_USER:-}
      GC_LOKI_URL: ${GC_LOKI_URL:-}
      GC_LOKI_USER: ${GC_LOKI_USER:-}
      GC_TOKEN: ${GC_TOKEN:-}
    ports: ["12345:12345"]
    restart: unless-stopped

volumes:
  hls:
  encoder-source:
  alloy-data:
