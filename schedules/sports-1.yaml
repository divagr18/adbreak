# Avail schedule for channel sports-1.
# Phase A: a periodic break so the full chain exercises every ~2 minutes.
channel: sports-1
periodic:
  every_s: 120        # a break starts every 2 minutes...
  duration_s: 32      # ...lasting 32 seconds — exactly 8 x 4s segments, so the
                      # SSAI can substitute segments 1:1 and never has to
                      # rewrite EXT-X-MEDIA-SEQUENCE.
  break_type: mid_roll
  lead_time_s: 8      # cue is emitted this many seconds before splice_time
